<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentos legales · Suite de StrategyMark</title>
<style>
:root{color-scheme:light dark;--fondo:#ffffff;--texto:#1d1d22;--suave:#5c5c66;--linea:#e4e4ea;--acento:#5b3fd6;--aviso:#f4f2fd}
@media (prefers-color-scheme:dark){:root{--fondo:#121216;--texto:#ececf1;--suave:#a3a3ad;--linea:#2a2a33;--acento:#a996ff;--aviso:#1c1a2b}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
header{border-bottom:1px solid var(--linea);padding-bottom:16px;margin-bottom:24px}
header p{margin:4px 0 0;color:var(--suave);font-size:14px}
nav{display:flex;gap:16px;font-size:14px;margin-top:12px;flex-wrap:wrap}
h1{font-size:30px;line-height:1.2;margin:0}
h2{font-size:20px;margin:32px 0 8px}
h3{font-size:17px;margin:24px 0 6px}
a{color:var(--acento)}
.aviso{background:var(--aviso);border:1px solid var(--linea);border-radius:10px;padding:12px 16px;font-size:14px;margin-bottom:24px}
ul{padding-left:22px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--linea);color:var(--suave);font-size:13px}
</style>
</head>
<body>
<main>
<header><h1>Documentos legales</h1><p>Suite de StrategyMark</p></header>

</main>
</body>
</html>
